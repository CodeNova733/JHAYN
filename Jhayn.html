<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jhayn Vyaney 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;

  background:
    radial-gradient(
      ellipse at center,
      #1a0a1f 0%,
      #0a0510 60%,
      #000 100%
    );

  font-family: Georgia, serif;
}


/* =====================================================
   PARTÍCULAS DE FONDO
   ===================================================== */

#particles {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 1;
}


/* =====================================================
   CORAZÓN
   ===================================================== */

#heartCanvas {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 2;

  pointer-events: none;
}


/* =====================================================
   CONTENEDOR DEL NOMBRE
   ===================================================== */

.name-container {

  position: fixed;

  inset: 0;

  z-index: 3;

  display: flex;

  align-items: center;

  justify-content: center;

  pointer-events: none;
}


/*
   Este contenedor tiene una posición fija.
   El nombre nunca va a mover el centro.
*/

.name-fixed {

  position: relative;

  width: min(90vw, 700px);

  height: 190px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;
}


/* =====================================================
   NOMBRES
   ===================================================== */

.name-line {

  font-family:
    'Great Vibes',
    'Brush Script MT',
    cursive;

  font-size:
    clamp(3rem, 9vw, 6rem);

  line-height: 0.9;

  letter-spacing: 3px;

  white-space: nowrap;

  background:
    linear-gradient(
      90deg,
      #ff9ec4,
      #ff4d88,
      #ffd1e3,
      #ff4d88,
      #ff9ec4
    );

  background-size: 300% 100%;

  -webkit-background-clip: text;
  background-clip: text;

  -webkit-text-fill-color: transparent;

  text-shadow:
    0 0 25px rgba(255, 77, 136, 0.65),
    0 0 60px rgba(255, 77, 136, 0.35);

  opacity: 0;

  transform: translateY(0);

  will-change: opacity, transform;

  animation:
    shine 4s linear infinite;
}


/* =====================================================
   JHAYN
   ===================================================== */

#jhayn {

  min-height: 80px;

}


/*
   Aparece suavemente.
*/

#jhayn.show {

  animation:
    showJhayn 1.2s ease forwards,
    shine 4s linear infinite;
}


@keyframes showJhayn {

  from {

    opacity: 0;

    transform:
      translateY(-20px)
      scale(0.95);
  }

  to {

    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }
}


/* =====================================================
   VIANEY
   ===================================================== */

#vyaney {

  min-height: 80px;

  margin-top: 12px;

}


/*
   Vyaney aparece debajo.
*/

#vyaney.show {

  animation:
    showVyaney 1.3s ease forwards,
    shine 4s linear infinite;
}


@keyframes showVyaney {

  from {

    opacity: 0;

    transform:
      translateY(25px)
      scale(0.95);
  }

  to {

    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }
}


/* =====================================================
   BRILLO DEL TEXTO
   ===================================================== */

@keyframes shine {

  0% {

    background-position:
      0% 50%;
  }

  100% {

    background-position:
      300% 50%;
  }
}


/* =====================================================
   BOTÓN
   ===================================================== */

.btn-wrap {

  position: fixed;

  bottom: 12%;

  left: 50%;

  transform:
    translateX(-50%);

  z-index: 5;

  opacity: 0;

  animation:
    fadeInBtn 1.5s
    0.5s
    ease forwards;
}


@keyframes fadeInBtn {

  to {

    opacity: 1;
  }
}


button {

  position: relative;

  padding:
    16px 42px;

  font-size:
    1rem;

  letter-spacing:
    3px;

  text-transform:
    uppercase;

  color:
    #ffd9e6;

  background:
    linear-gradient(
      135deg,
      rgba(255, 77, 136, 0.25),
      rgba(120, 20, 60, 0.35)
    );

  border:
    1.5px solid
    rgba(255, 150, 190, 0.7);

  border-radius:
    50px;

  cursor:
    pointer;

  font-family:
    Georgia, serif;

  backdrop-filter:
    blur(8px);

  box-shadow:
    0 0 25px
    rgba(255, 77, 136, 0.5),

    inset 0 0 20px
    rgba(255, 77, 136, 0.15);

  transition:
    all 0.4s ease;

  overflow:
    hidden;
}


button:hover {

  color:
    #fff;

  border-color:
    #ff9ec4;

  box-shadow:

    0 0 45px
    rgba(255, 77, 136, 0.9),

    inset 0 0 30px
    rgba(255, 77, 136, 0.3);

  transform:
    scale(1.05);

  letter-spacing:
    5px;
}


button:active {

  transform:
    scale(0.97);
}


button.hidden {

  opacity: 0;

  pointer-events: none;

  transform:
    translateX(-50%)
    translateY(20px);

  transition:
    all 0.8s ease;
}


/* =====================================================
   CORAZONES FLOTANTES
   ===================================================== */

.floating-heart {

  position: fixed;

  z-index: 4;

  pointer-events: none;

  font-size:
    1.5rem;

  color:
    #ff5c8d;

  text-shadow:
    0 0 15px #ff5c8d;

  animation:
    floatUp 3s ease-out forwards;
}


@keyframes floatUp {

  0% {

    transform:
      translateY(0)
      scale(0.5);

    opacity: 0;
  }

  20% {

    opacity: 1;
  }

  100% {

    transform:
      translateY(-350px)
      scale(1.4);

    opacity: 0;
  }
}


/* =====================================================
   MARCO DECORATIVO
   ===================================================== */

.corner {

  position: fixed;

  width: 60px;

  height: 60px;

  border:
    1.5px solid
    rgba(255, 150, 190, 0.35);

  z-index: 4;

  pointer-events: none;
}


.corner.tl {

  top: 20px;
  left: 20px;

  border-right: none;
  border-bottom: none;
}


.corner.tr {

  top: 20px;
  right: 20px;

  border-left: none;
  border-bottom: none;
}


.corner.bl {

  bottom: 20px;
  left: 20px;

  border-right: none;
  border-top: none;
}


.corner.br {

  bottom: 20px;
  right: 20px;

  border-left: none;
  border-top: none;
}


/* =====================================================
   RESPONSIVE
   ===================================================== */

@media (max-width: 600px) {

  .name-fixed {

    height: 150px;

    width: 95vw;
  }


  .name-line {

    font-size:
      clamp(
        2.8rem,
        14vw,
        4.5rem
      );

    letter-spacing:
      1px;
  }


  #vyaney {

    margin-top:
      8px;
  }


  button {

    padding:
      14px 30px;

    font-size:
      0.85rem;
  }


  .corner {

    width: 40px;

    height: 40px;
  }
}

</style>
</head>


<body>


<!-- =====================================================
     CANVAS DE PARTÍCULAS
     ===================================================== -->

<canvas id="particles"></canvas>


<!-- =====================================================
     CANVAS DEL CORAZÓN
     ===================================================== -->

<canvas id="heartCanvas"></canvas>


<!-- =====================================================
     MARCO
     ===================================================== -->

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>


<!-- =====================================================
     NOMBRE
     ===================================================== -->

<div class="name-container">

  <div class="name-fixed">

    <div
      id="jhayn"
      class="name-line"
    >
      Jhayn
    </div>


    <div
      id="vyaney"
      class="name-line"
    >
      Vyaney
    </div>

  </div>

</div>


<!-- =====================================================
     BOTÓN
     ===================================================== -->

<div
  class="btn-wrap"
  id="btnWrap"
>

  <button id="magicBtn">

    ✦ Tócame ✦

  </button>

</div>


<script>


/* =====================================================
   PARTÍCULAS DE FONDO
   ===================================================== */

const pCanvas =
  document.getElementById(
    'particles'
  );

const pCtx =
  pCanvas.getContext('2d');


let pW;
let pH;

let particles = [];


function resizeP() {

  pW =
    pCanvas.width =
    window.innerWidth;

  pH =
    pCanvas.height =
    window.innerHeight;
}


resizeP();


window.addEventListener(
  'resize',
  resizeP
);


/* =====================================================
   CLASE PARTICLE
   ===================================================== */

class Particle {

  constructor() {

    this.reset();
  }


  reset() {

    this.x =
      Math.random() * pW;

    this.y =
      Math.random() * pH;

    this.size =
      Math.random() * 2 + 0.5;

    this.speedX =
      (Math.random() - 0.5)
      * 0.3;

    this.speedY =
      (Math.random() - 0.5)
      * 0.3;

    this.alpha =
      Math.random() * 0.6
      + 0.2;

    this.hue =
      Math.random() * 40
      + 320;
  }


  update() {

    this.x +=
      this.speedX;

    this.y +=
      this.speedY;


    if (

      this.x < 0 ||
      this.x > pW ||
      this.y < 0 ||
      this.y > pH

    ) {

      this.reset();
    }
  }


  draw() {

    pCtx.beginPath();


    pCtx.arc(

      this.x,
      this.y,
      this.size,
      0,
      Math.PI * 2

    );


    pCtx.fillStyle =
      `hsla(
        ${this.hue},
        90%,
        70%,
        ${this.alpha}
      )`;


    pCtx.shadowBlur =
      10;


    pCtx.shadowColor =
      `hsla(
        ${this.hue},
        90%,
        70%,
        0.8
      )`;


    pCtx.fill();
  }
}


/* Crear partículas */

for (
  let i = 0;
  i < 120;
  i++
) {

  particles.push(
    new Particle()
  );
}


/* Animación */

function animateParticles() {

  pCtx.clearRect(
    0,
    0,
    pW,
    pH
  );


  particles.forEach(
    particle => {

      particle.update();

      particle.draw();

    }
  );


  requestAnimationFrame(
    animateParticles
  );
}


animateParticles();


/* =====================================================
   CORAZÓN
   ===================================================== */

const hCanvas =
  document.getElementById(
    'heartCanvas'
  );

const hCtx =
  hCanvas.getContext('2d');


let hW;
let hH;


function resizeH() {

  hW =
    hCanvas.width =
    window.innerWidth;

  hH =
    hCanvas.height =
    window.innerHeight;
}


resizeH();


window.addEventListener(
  'resize',
  resizeH
);


/* =====================================================
   ECUACIÓN DEL CORAZÓN
   ===================================================== */

function heartPoint(
  t,
  scale
) {

  const x =
    16 *
    Math.pow(
      Math.sin(t),
      3
    );


  const y =
    13 * Math.cos(t)
    - 5 * Math.cos(2 * t)
    - 2 * Math.cos(3 * t)
    - Math.cos(4 * t);


  return {

    x:
      x * scale,

    y:
      -y * scale
  };
}


/* =====================================================
   PARTÍCULA DEL CORAZÓN
   ===================================================== */

class HeartParticle {

  constructor(
    targetX,
    targetY,
    color
  ) {

    this.x =
      Math.random() * hW;

    this.y =
      Math.random() * hH;


    this.tx =
      targetX;

    this.ty =
      targetY;


    this.vx = 0;

    this.vy = 0;


    this.size =
      Math.random() * 2
      + 1.2;


    this.color =
      color;


    this.alpha = 0;


    this.delay =
      Math.random() * 800;


    this.startTime =
      performance.now();


    this.arrived =
      false;
  }


  update(now) {

    const elapsed =
      now -
      this.startTime;


    if (
      elapsed <
      this.delay
    ) {

      return;
    }


    if (
      !this.arrived
    ) {

      const dx =
        this.tx -
        this.x;


      const dy =
        this.ty -
        this.y;


      const dist =
        Math.hypot(
          dx,
          dy
        );


      if (
        dist < 2
      ) {

        this.arrived =
          true;

      } else {

        this.vx +=
          dx * 0.0012;

        this.vy +=
          dy * 0.0012;


        this.vx *=
          0.92;

        this.vy *=
          0.92;


        this.x +=
          this.vx;

        this.y +=
          this.vy;
      }

    } else {


      /*
        Latido suave
      */

      const beat =
        Math.sin(
          now * 0.005
        ) * 0.6;


      this.x =
        this.tx +
        beat *
        Math.cos(
          now * 0.002 +
          this.tx
        );


      this.y =
        this.ty +
        beat *
        Math.sin(
          now * 0.002 +
          this.ty
        );
    }


    this.alpha =
      Math.min(
        1,
        this.alpha + 0.02
      );
  }


  draw() {

    hCtx.beginPath();


    hCtx.arc(

      this.x,
      this.y,
      this.size,
      0,
      Math.PI * 2

    );


    hCtx.fillStyle =
      this.color.replace(
        'ALPHA',
        this.alpha.toFixed(2)
      );


    hCtx.shadowBlur =
      15;


    hCtx.shadowColor =
      this.color.replace(
        'ALPHA',
        '0.9'
      );


    hCtx.fill();
  }
}


/* =====================================================
   CONSTRUIR CORAZÓN
   ===================================================== */

let heartParticles = [];

let heartActive =
  false;


function buildHeart() {

  heartParticles = [];


  const scale =
    Math.min(
      hW,
      hH
    ) / 42;


  const count =
    380;


  const colors = [

    'rgba(255, 105, 180, ALPHA)',

    'rgba(255, 60, 120, ALPHA)',

    'rgba(255, 180, 210, ALPHA)',

    'rgba(255, 20, 90, ALPHA)',

    'rgba(255, 220, 240, ALPHA)'
  ];


  /* =========================================
     BORDE
     ========================================= */

  for (
    let i = 0;
    i < count;
    i++
  ) {

    const t =
      (i / count) *
      Math.PI * 2;


    const p =
      heartPoint(
        t,
        scale
      );


    const cx =
      hW / 2 +
      p.x;


    const cy =
      hH / 2 +
      p.y;


    const jitterX =
      (Math.random() - 0.5)
      * 8;


    const jitterY =
      (Math.random() - 0.5)
      * 8;


    const color =
      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ];


    heartParticles.push(

      new HeartParticle(

        cx + jitterX,

        cy + jitterY,

        color

      )

    );
  }


  /* =========================================
     INTERIOR
     ========================================= */

  for (
    let i = 0;
    i < 180;
    i++
  ) {

    const t =
      Math.random() *
      Math.PI * 2;


    const r =
      Math.random();


    const p =
      heartPoint(
        t,
        scale * r
      );


    const cx =
      hW / 2 +
      p.x;


    const cy =
      hH / 2 +
      p.y;


    const color =
      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ];


    heartParticles.push(

      new HeartParticle(

        cx,

        cy,

        color

      )

    );
  }


  heartActive =
    true;
}


/* =====================================================
   ANIMACIÓN DEL CORAZÓN
   ===================================================== */

function animateHeart(
  now
) {

  hCtx.clearRect(

    0,
    0,
    hW,
    hH

  );


  if (
    heartActive
  ) {

    heartParticles.forEach(
      particle => {

        particle.update(now);

        particle.draw();

      }
    );
  }


  requestAnimationFrame(
    animateHeart
  );
}


animateHeart(
  performance.now()
);


/* =====================================================
   ELEMENTOS
   ===================================================== */

const btn =
  document.getElementById(
    'magicBtn'
  );


const btnWrap =
  document.getElementById(
    'btnWrap'
  );


const jhayn =
  document.getElementById(
    'jhayn'
  );


const vyaney =
  document.getElementById(
    'vyaney'
  );


/* =====================================================
   CLICK DEL BOTÓN
   ===================================================== */

btn.addEventListener(
  'click',
  () => {


    /*
      Ocultar botón
    */

    btnWrap.classList.add(
      'hidden'
    );


    /*
      Formar corazón
    */

    buildHeart();


    /* =========================================
       CORAZONES FLOTANTES
       ========================================= */

    for (
      let i = 0;
      i < 18;
      i++
    ) {

      setTimeout(
        () => {

          const h =
            document.createElement(
              'div'
            );


          h.className =
            'floating-heart';


          h.textContent =
            '❤';


          h.style.left =
            (
              Math.random() *
              80 +
              10
            ) + '%';


          h.style.top =
            (
              Math.random() *
              30 +
              60
            ) + '%';


          h.style.fontSize =
            (
              Math.random() *
              1.5 +
              1
            ) + 'rem';


          h.style.color =
            [

              '#ff5c8d',

              '#ff9ec4',

              '#ff2d6e',

              '#ffb3cc'

            ][

              Math.floor(
                Math.random() * 4
              )

            ];


          document.body.appendChild(
            h
          );


          setTimeout(
            () => h.remove(),
            3000
          );

        },
        i * 100
      );
    }


    /* =========================================
       APARICIÓN DEL NOMBRE
       ========================================= */


    /*
      Primero aparece JHAYN
    */

    setTimeout(
      () => {

        jhayn.classList.add(
          'show'
        );

      },
      1600
    );


    /*
      Después aparece VIANEY
      debajo.
    */

    setTimeout(
      () => {

        vyaney.classList.add(
          'show'
        );

      },
      2800
    );

  }
);


/* =====================================================
   EXPLOSIÓN AL HACER CLICK
   ===================================================== */

document.addEventListener(
  'click',
  (e) => {


    if (
      e.target === btn
    ) {

      return;
    }


    for (
      let i = 0;
      i < 8;
      i++
    ) {

      const p =
        document.createElement(
          'div'
        );


      p.style.position =
        'fixed';


      p.style.left =
        e.clientX + 'px';


      p.style.top =
        e.clientY + 'px';


      p.style.width =
        '4px';


      p.style.height =
        '4px';


      p.style.borderRadius =
        '50%';


      p.style.background =
        '#ff5c8d';


      p.style.boxShadow =
        '0 0 10px #ff5c8d';


      p.style.pointerEvents =
        'none';


      p.style.zIndex =
        '10';


      document.body.appendChild(
        p
      );


      const angle =
        Math.random() *
        Math.PI * 2;


      const speed =
        Math.random() *
        100 +
        40;


      const dx =
        Math.cos(angle) *
        speed;


      const dy =
        Math.sin(angle) *
        speed;


      p.animate(

        [

          {
            transform:
              'translate(0,0) scale(1)',

            opacity: 1
          },

          {

            transform:
              `translate(${dx}px, ${dy}px) scale(0)`,

            opacity: 0

          }

        ],

        {

          duration:
            800,

          easing:
            'cubic-bezier(0.2, 0.8, 0.3, 1)'

        }

      ).onfinish =
        () => p.remove();

    }

  }
);

</script>

</body>
</html>
